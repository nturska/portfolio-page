<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Tło: zaokrąglony kwadrat (zmień 'fill' aby zmienić kolor tła) -->
  <rect width="100" height="100" rx="20" fill="#000000" />
  
  <!-- Tekst: NT (zmień 'fill' aby zmienić kolor liter) -->
  <text x="50" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="45" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">
    NT
  </text>
</svg>